<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBMC Entrep Fair Group 3 - Milk Tea Shop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;

      
      background-image: url('https://i.pinimg.com/736x/4f/36/08/4f3608d7002531dd651444ec7efd69b3.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }



    /* =========================================================
       2. MAIN CARD CONTAINER (GLASSMORPHISM EFFECT)
       ========================================================= */
    .container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 35px 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    h1 {
      font-size: 22px;
      text-align: center;
      color: #4a3525;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h2 {
      font-size: 16px;
      color: #7c5c43;
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }

    /* =========================================================
       3. MENU ITEM STYLES
       ========================================================= */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fdfbf7;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #ebdccb;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .menu-item:hover {
      background: #f7eee3;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .menu-item label {
      display: flex;
      align-items: center;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #3b2b1e;
    }

    .menu-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #a88467;
      border-radius: 5px;
      margin-right: 14px;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: 0.2s ease;
    }

    .menu-item input[type="checkbox"]::before {
      content: "";
      width: 10px;
      height: 10px;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em #fff;
      background-color: #fff;
      transform-origin: center;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }

    .menu-item input[type="checkbox"]:checked {
      background-color: #7c5c43;
      border-color: #7c5c43;
    }

    .menu-item input[type="checkbox"]:checked::before {
      transform: scale(1);
    }

    .item-name {
      flex-grow: 1;
    }

    .item-price {
      font-weight: bold;
      color: #8c5d3b;
    }

    button {
      width: 100%;
      background-color: #7c5c43;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(124, 92, 67, 0.3);
    }

    button:hover {
      background-color: #634732;
    }

    button:active {
      transform: scale(0.98);
    }

    .receipt-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #d5c3b1;
    }

    .receipt-title {
      font-size: 16px;
      font-weight: 700;
      color: #4a3525;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-align: center;
    }

    #receipt-output {
      font-family: 'Courier New', Courier, monospace;
      background: #fefcf9;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #ebdccb;
      font-size: 15px;
      line-height: 1.5;
      color: #2b2017;
      min-height: 50px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>OBMC Entrep Fair</h1>
    <h2>Group 3 - Milk Tea Shop</h2>

    <form id="orderForm">
      <div class="menu-list">
        <div class="menu-item">
          <label>
            <input type="checkbox" value="110" data-name="Matcha">
            <span class="item-name">Matcha</span>
            <span class="item-price">₱110</span>
          </label>
        </div>
        <div class="menu-item">
          <label>
            <input type="checkbox" value="100" data-name="Thai Tea">
            <span class="item-name">Thai Tea</span>
            <span class="item-price">₱100</span>
          </label>
        </div>
        <div class="menu-item">
          <label>
            <input type="checkbox" value="105" data-name="Taro">
            <span class="item-name">Taro</span>
            <span class="item-price">₱105</span>
          </label>
        </div>
        <div class="menu-item">
          <label>
            <input type="checkbox" value="110" data-name="Brown Sugar">
            <span class="item-name">Brown Sugar</span>
            <span class="item-price">₱110</span>
          </label>
        </div>
        <div class="menu-item">
          <label>
            <input type="checkbox" value="100" data-name="Mango">
            <span class="item-name">Mango</span>
            <span class="item-price">₱100</span>
          </label>
        </div>
      </div>

      <button type="button" onclick="generateReceipt()">Create Order</button>
    </form>

    <div class="receipt-section">
      <div class="receipt-title">===== Receipt =====</div>
      <div id="receipt-output">Select items and click "Create Order".</div>
    </div>
  </div>

  <script>
    function generateReceipt() {
      const checkboxes = document.querySelectorAll('#orderForm input[type="checkbox"]:checked');
      let receiptText = "";
      let total = 0;

      if (checkboxes.length === 0) {
        receiptText = "No items selected.";
      } else {
        checkboxes.forEach(item => {
          const name = item.getAttribute('data-name');
          const price = parseInt(item.value);
          receiptText += `${name.padEnd(16, '.')} ₱${price}\n`;
          total += price;
        });
        receiptText += `-------------------------\n`;
        receiptText += `Total:${''.padEnd(11, ' ')} ₱${total}`;
      }

      document.getElementById('receipt-output').innerText = receiptText;
    }
  </script>

</body>
</html>
